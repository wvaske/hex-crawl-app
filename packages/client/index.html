<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` lets the bottom tab bar pad itself past the iPhone
      home indicator (env(safe-area-inset-bottom)). `user-scalable` is left at
      its default on purpose: browser zoom on panels is an accessibility
      affordance, and the map suppresses page gestures itself via
      `touch-action: none` on the canvas (see index.css).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⬡</text></svg>"
    />
    <title>HexCrawl VTT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
